<html lang="en" class="scroll-smooth">

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="VAEL is an independent digital studio creating art-directed invitations and private digital experiences for weddings, engagements, and meaningful celebrations." />
    
    <!-- Open Graph Metadata -->
    <meta property="og:title" content="VAEL — Digital Invitations & Private Experiences" />
    <meta property="og:description" content="VAEL is an independent digital studio creating art-directed invitations and private digital experiences for weddings, engagements, and meaningful celebrations." />
    <meta property="og:type" content="website" />
    
    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VAEL — Digital Invitations & Private Experiences" />
    <meta name="twitter:description" content="VAEL is an independent digital studio creating art-directed invitations and private digital experiences for weddings, engagements, and meaningful celebrations." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F5F5F7] text-[#0F0F12] antialiased selection:bg-black/10 selection:text-black overflow-x-hidden">
    <!-- SVG Refraction / Liquid Glass Filters -->
    <svg class="hidden" width="0" height="0">
      <defs>
        <filter id="liquid-refraction" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.015 0.02" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="glass-edge">
          <feSpecularLighting surfaceScale="2" specularConstant="1.2" specularExponent="20" lighting-color="#ffffff">
            <feDistantLight azimuth="225" elevation="45"/>
          </feSpecularLighting>
          <feComposite in2="SourceGraphic" operator="in"/>
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
