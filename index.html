<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VAEL — Bespoke Digital Experiences & Personal Artifacts</title>
    <meta name="description" content="VAEL is a luxury creative technology studio crafting personalized digital websites, personal archives, and digital gifts for meaningful occasions." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F5F5F7] text-[#0F0F12] antialiased selection:bg-black/10 selection:text-black overflow-x-hidden">
    <!-- SVG Refraction / Liquid Glass Filters -->
    <svg class="hidden" width="0" height="0">
      <defs>
        <filter id="liquid-refraction" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.015 0.02" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="glass-edge">
          <feSpecularLighting surfaceScale="2" specularConstant="1.2" specularExponent="20" lighting-color="#ffffff">
            <feDistantLight azimuth="225" elevation="45"/>
          </feSpecularLighting>
          <feComposite in2="SourceGraphic" operator="in"/>
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
